# Unit tests (fail-fast, then race), e2e, lint, gosec, and govulncheck on master
# and pull requests.
# Classic test.sh is not run here: GitHub-hosted runners are sandboxed
# (no root, no raw IP, no TUN, incomplete kernel features).
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos
            os: macos-latest
          - name: windows-amd64
            os: windows-latest
          - name: windows-arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Same step names on every matrix cell so GitHub does not show skipped
      # gray 0s entries next to coverage-only work.
      - name: Unit tests
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "linux-amd64" ]; then
            make fmt-check
            go test ./...
          elif [ "${{ runner.os }}" = "Windows" ]; then
            # gofmt is Ubuntu-only (lint job). Windows checkouts are CRLF unless
            # .gitattributes forces LF; gofmt -l then lists every file.
            go test ./...
          else
            make test
          fi
      # Fail-fast unit tests above; race is 2-20x slower and OS-specific.
      # Keep this step on every cell (including windows-arm64) to avoid a
      # skipped gray 0. Go has no race detector on windows/arm64.
      - name: Race tests
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "windows-arm64" ]; then
            echo "skip: Go race detector is not supported on windows/arm64"
            exit 0
          fi
          if [ "${{ matrix.name }}" = "linux-amd64" ]; then
            go test -race -coverpkg=./... -covermode=atomic -coverprofile=coverage.unit.raw ./...
            python3 -B scripts/merge-coverprofile.py coverage.unit.raw coverage.unit.out
            rm -f coverage.unit.raw
            go tool cover -func=coverage.unit.out | tee coverage.unit.txt
            go tool cover -html=coverage.unit.out -o coverage.unit.html
            ./scripts/coverage-summary.sh coverage.unit.out
          else
            go test -race ./...
          fi
      - name: Upload unit coverage
        if: matrix.name == 'linux-amd64' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: |
            coverage.unit.out
            coverage.unit.txt
            coverage.unit.html
      - name: Upload unit coverage to Codecov
        if: >-
          matrix.name == 'linux-amd64' && !cancelled() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.unit.out
          flags: unit
          name: unit-linux-amd64
          fail_ci_if_error: true
          disable_search: true
      - name: Go vet Windows files
        if: matrix.name == 'windows-amd64'
        shell: bash
        run: go vet ./...

  e2e:
    name: e2e (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos
            os: macos-latest
          - name: windows-amd64
            os: windows-latest
          - name: windows-arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: End-to-end tests
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "linux-amd64" ]; then
            make e2e-cover
            go tool cover -html=coverage.e2e.out -o coverage.e2e.html
          elif [ "${{ runner.os }}" = "Windows" ]; then
            go build -o socat.exe ./cmd/socat
            go build -o filan.exe ./cmd/filan
            go build -o procan.exe ./cmd/procan
            go test -tags=e2e ./e2e/...
          else
            make e2e
          fi
      - name: Upload e2e coverage
        if: matrix.name == 'linux-amd64' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-coverage
          path: |
            coverage.e2e.out
            coverage.e2e.html
            coverage/e2e
      - name: Upload e2e coverage to Codecov
        if: >-
          matrix.name == 'linux-amd64' && !cancelled() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.e2e.out
          flags: e2e
          name: e2e-linux-amd64
          fail_ci_if_error: true
          disable_search: true

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # The gosec Docker action image ships Go 1.26 with GOTOOLCHAIN=local
      # and cannot load a go 1.27 module. Install the same pin as
      # .cursor/install.sh and run `make gosec` on the setup-go toolchain.
      - name: Install gosec
        run: |
          toolchain="$(awk '/^toolchain / { print $2; exit }' go.mod)"
          GOTOOLCHAIN="$toolchain" go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
      - name: gosec
        run: make gosec

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
