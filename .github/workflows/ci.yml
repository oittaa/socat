# Unit tests, e2e, lint, and gosec on master and pull requests.
# Classic test.sh is not run here: GitHub-hosted runners are sandboxed
# (no root, no raw IP, no TUN, incomplete kernel features).
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos
            os: macos-latest
          - name: windows-amd64
            os: windows-latest
          - name: windows-arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests
        if: runner.os != 'Windows'
        run: make test
      - name: Unit tests
        if: runner.os == 'Windows'
        shell: bash
        run: |
          out=$(gofmt -l cmd e2e internal scripts/benchclient version.go)
          if [ -n "$out" ]; then
            echo "gofmt needed:" >&2
            echo "$out" >&2
            exit 1
          fi
          go test ./...

  e2e:
    name: e2e (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos
            os: macos-latest
          - name: windows-amd64
            os: windows-latest
          - name: windows-arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: End-to-end tests
        if: runner.os != 'Windows'
        run: make e2e
      - name: End-to-end tests
        if: runner.os == 'Windows'
        shell: bash
        run: |
          go build -o socat.exe ./cmd/socat
          go build -o filan.exe ./cmd/filan
          go build -o procan.exe ./cmd/procan
          go test -tags=e2e ./e2e/...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gosec
        uses: securego/gosec@v2.28.0
        with:
          args: >-
            -exclude-dir=testdata
            -nosec-require-rules
            -nosec-require-justification
            ./...
