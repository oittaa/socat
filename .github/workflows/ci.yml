name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-386:
    name: build (windows-386)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile
        env:
          GOOS: windows
          GOARCH: '386'
          CGO_ENABLED: '0'
        run: go build ./...

  unit:
    name: unit (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos
            os: macos-latest
          - name: windows-amd64
            os: windows-latest
          - name: windows-arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests
        run: go test -count=1 ./...
      - name: Go vet
        run: go vet ./...

  race:
    name: race (${{ matrix.name }})
    # Linux amd64 runs with coverage below. Go has no Windows arm64 race detector.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos
            os: macos-latest
          - name: windows-amd64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Race tests
        run: go test -race -count=1 ./...

  unit-coverage:
    name: race (linux-amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Race tests with coverage
        run: go test -race -count=1 -coverpkg=./... -covermode=atomic -coverprofile=coverage.unit.raw ./...
      - name: Prepare unit coverage
        run: |
          python3 -B scripts/merge-coverprofile.py coverage.unit.raw coverage.unit.out
          go tool cover -func=coverage.unit.out | tee coverage.unit.txt
          go tool cover -html=coverage.unit.out -o coverage.unit.html
          ./scripts/coverage-summary.sh coverage.unit.out
      - name: Upload unit coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: |
            coverage.unit.out
            coverage.unit.txt
            coverage.unit.html
      - name: Upload unit coverage to Codecov
        if: >-
          !cancelled() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.unit.out
          flags: unit
          name: unit-linux-amd64
          fail_ci_if_error: true
          disable_search: true

  scripts:
    name: scripts (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Script tests
        run: python3 -B -m unittest discover -s scripts -p '*_test.py'

  e2e:
    name: e2e (${{ matrix.name }})
    # Linux amd64 runs with coverage below.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos
            os: macos-latest
          - name: windows-amd64
            os: windows-latest
          - name: windows-arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binaries
        run: |
          go build ./cmd/socat
          go build ./cmd/filan
          go build ./cmd/procan
      - name: End-to-end tests
        run: go test -count=1 -tags=e2e ./e2e/...

  e2e-coverage:
    name: e2e (linux-amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: End-to-end tests with coverage
        run: |
          make e2e-cover
          go tool cover -html=coverage.e2e.out -o coverage.e2e.html
      - name: Upload e2e coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-coverage
          path: |
            coverage.e2e.out
            coverage.e2e.html
            coverage/e2e
      - name: Upload e2e coverage to Codecov
        if: >-
          !cancelled() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.e2e.out
          flags: e2e
          name: e2e-linux-amd64
          fail_ci_if_error: true
          disable_search: true

  privileged-unit:
    name: privileged unit (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Raw-IP unit tests
        run: |
          sudo "$(command -v go)" test -race -count=1 -v -tags=privileged ./internal/xio/privileged

  privileged-e2e:
    name: privileged e2e (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build socat
        run: go build ./cmd/socat
      - name: Raw-IP end-to-end tests
        run: |
          sudo env SOCAT="$PWD/socat" "$(command -v go)" test -count=1 -v -tags=e2e,privileged ./e2e/privileged

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: make fmt-check
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install gosec
        run: GOTOOLCHAIN=local go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
      - name: gosec
        run: make gosec

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
