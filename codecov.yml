# PR comments and status checks from Codecov (codecov.io).
comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  - "testdata/**"
  - "examples/**"
  - "scripts/fuzzall/**"
  - "scripts/benchclient/**"

flag_management:
  default_rules:
    carryforward: true
